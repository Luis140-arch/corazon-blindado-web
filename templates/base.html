<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="icon" href="{{ url_for('static', filename='favicon.png') }}" type="image/png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corazón Blindado 2.0 | UCV</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 flex flex-col justify-between">

    <!-- Encabezado / Navbar -->
    <header class="bg-blue-900 text-white py-4 px-6 shadow-md">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                🛡️ Corazón Blindado 2.0
            </h1>
            <span class="text-xs bg-blue-800 px-3 py-1 rounded-full text-blue-200">100% Anónimo</span>
        </div>
    </header>

    <!-- Contenido dinámico -->
    <main class="max-w-3xl w-full mx-auto p-4 my-6">
        {% block content %}{% endblock %}
    </main>

    <!-- Pie de página -->
    <footer class="bg-slate-200 text-center py-4 text-xs text-slate-500">
        <p>
            Plataforma de soporte y triaje psicológico universitario - UCV
            <a href="/login" class="ml-2 hover:text-slate-600 transition" title="Acceso a Psicología">🔒</a>
        </p>
    </footer>

</body>
</html>
