{% extends 'base.html' %}

{% block content %}
<div class="max-w-md mx-auto bg-white rounded-xl shadow-sm p-8 border border-slate-200 mt-10">
    <div class="text-center mb-6">
        <h2 class="text-2xl font-black text-blue-900">Acceso Restringido</h2>
        <p class="text-xs text-slate-500 mt-1">Portal exclusivo para Psicología UCV</p>
    </div>

    {% if error %}
    <div class="bg-red-50 text-red-600 text-xs font-bold p-3 rounded mb-4 text-center border border-red-200">
        ❌ {{ error }}
    </div>
    {% endif %}

    <form action="/login" method="POST" class="space-y-4">
        <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Usuario</label>
            <input type="text" name="usuario" required class="w-full bg-slate-50 border border-slate-200 rounded p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Contraseña</label>
            <input type="password" name="password" required class="w-full bg-slate-50 border border-slate-200 rounded p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <button type="submit" class="w-full bg-blue-900 hover:bg-blue-800 text-white font-bold py-3 px-4 rounded shadow transition mt-2">
            Iniciar Sesión
        </button>
    </form>
    <div class="text-center mt-4">
        <a href="/" class="text-xs text-slate-400 hover:text-slate-600">Volver al inicio</a>
    </div>
</div>
{% endblock %}
